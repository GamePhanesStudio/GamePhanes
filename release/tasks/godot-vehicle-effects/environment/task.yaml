name: godot-vehicle-braking-camera-and-rocket-smoke
description: Implement smooth vehicle stopping, horizontal launcher camera follow
  and a continuous rocket smoke trail.
runtime_adapter: godot
real_behavior_contract:
  starter_object: Main.tscn Godot scene with VehicleEffects vehicle braking, launcher
    camera and rocket smoke component

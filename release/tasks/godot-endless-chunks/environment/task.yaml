name: godot-endless-streaming-level
description: Generate deterministic endless chunks with spike hazards in gaps and
  gated entity unlocks.
runtime_adapter: godot
real_behavior_contract:
  starter_object: Main.tscn Godot scene with EndlessLevel streaming generator and
    spike hazard slots
  multi_step_events:
  - configure seed -> generate chunk 0 -> generate chunk 1
  - repeat chunk request -> test valid and invalid entity unlock progress -> mutate
    snapshot
  state_transition: seed configuration deterministically changes generated chunk data
    and valid progress unlocks entities
  boundary_behavior: repeated chunk requests are stable; invalid entities or progress
    below three remain locked
  observation: Godot headless probe observes native scene startup and EndlessLevel
    chunk arrays/hazard state
  runtime_adapter: godot
deliverables:
- Main.tscn
- scripts/endless_level.gd
validation:
- Godot parses headlessly
- hidden state probes pass

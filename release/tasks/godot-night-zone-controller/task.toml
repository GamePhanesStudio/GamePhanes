schema_version = "1.1"
engine = "godot"
artifacts = [
    "/app/Main.tscn",
    "/app/project.godot",
    "/app/scripts/",
]

[task]
name = "gameforgebench/godot-night-zone-controller"
description = "Repair a Godot NightZone state controller to apply night tuning, growing enemy stats, path-cost reduction, and snapshot isolation."
authors = [{ name = "GameForgeBench", email = "bench@gamephanes.dev" }]

[metadata]
difficulty = "medium"
category = "Software"
subcategory = "Game Development"
tags = ["godot", "state-machine", "enemy-ai", "pathfinding", "snapshot"]
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
